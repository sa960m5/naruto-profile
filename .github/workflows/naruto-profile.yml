name: Naruto Profile Automation

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  generate-and-deploy:
    name: Generate and Deploy Naruto Profile
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # STEP 1: CHECKOUT FRAMEWORK
      # ==========================================

      - name: Checkout Naruto Profile Framework
        uses: actions/checkout@v4

      # ==========================================
      # STEP 2: SETUP PYTHON
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ==========================================
      # STEP 3: INSTALL DEPENDENCIES
      # ==========================================

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==========================================
      # STEP 4: PREPARE PROFILE CONFIGURATION
      # ==========================================

      - name: Prepare Profile Configuration
        env:
          PROFILE_USERNAME: ${{ vars.PROFILE_USERNAME }}
        run: |
          if [ -z "$PROFILE_USERNAME" ]; then
            echo "PROFILE_USERNAME variable is missing."
            exit 1
          fi

          cp config/config.example.json config/config.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config_path = Path("config/config.json")

          with config_path.open("r", encoding="utf-8") as file:
              config = json.load(file)

          config["github_username"] = os.environ["PROFILE_USERNAME"]

          with config_path.open("w", encoding="utf-8") as file:
              json.dump(config, file, indent=4, ensure_ascii=False)

          print("[SUCCESS] Profile configuration prepared.")
          PY

      # ==========================================
      # STEP 5: PREPARE NINJA WAY CONFIGURATION
      # ==========================================

      - name: Prepare Ninja Way Configuration
        run: |
          cp config/ninja_way.example.json config/ninja_way.json
          echo "[SUCCESS] Ninja Way configuration prepared."

      # ==========================================
      # STEP 6: FETCH GITHUB REPOSITORIES
      # ==========================================

      - name: Fetch GitHub Repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/fetch_repositories.py

      # ==========================================
      # STEP 7: FETCH GITHUB PROFILE
      # ==========================================

      - name: Fetch GitHub Profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/fetch_profile.py

      # ==========================================
      # STEP 8: GENERATE NARUTO SHOWCASE
      # ==========================================

      - name: Generate Naruto Showcase
        run: |
          python scripts/naruto_theme.py
          python scripts/generate_animated_showcase.py

      # ==========================================
      # STEP 9: GENERATE HERO SECTION
      # ==========================================

      - name: Generate Hero Section
        run: |
          python scripts/generate_hero.py

      # ==========================================
      # STEP 10: GENERATE NINJA WAY SECTION
      # ==========================================

      - name: Generate Ninja Way Section
        run: |
          python scripts/generate_ninja_way.py

      # ==========================================
      # STEP 11: GENERATE PROFILE README
      # ==========================================

      - name: Generate Profile README
        run: |
          python scripts/generate_readme.py

      # ==========================================
      # STEP 12: CHECKOUT PROFILE REPOSITORY
      # ==========================================

      - name: Checkout GitHub Profile Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PROFILE_USERNAME }}/${{ vars.PROFILE_USERNAME }}
          token: ${{ secrets.PROFILE_REPO_TOKEN }}
          path: profile-repo

            # ==========================================
      # STEP 13: DEPLOY GENERATED FILES
      # ==========================================

      - name: Deploy Generated Profile Files
        run: |

          # Profile README
          cp dist/profile/README.md profile-repo/README.md

          # Naruto animated showcase
          cp dist/profile/repository-showcase.gif profile-repo/repository-showcase.gif

          # Generated Hero and Ninja Way assets
          mkdir -p profile-repo/assets
          cp dist/profile/assets/hero.svg profile-repo/assets/hero.svg

          mkdir -p profile-repo/assets/ninja-way
          cp dist/profile/assets/ninja-way/ninja-way.svg profile-repo/assets/ninja-way/ninja-way.svg

          # Character artwork
          mkdir -p profile-repo/assets/characters
          cp assets/characters/custom-character.gif profile-repo/assets/characters/

          # Ninja Way artwork
          cp assets/ninja-way/ninja-duo.gif profile-repo/assets/ninja-way/
      # ==========================================
      # STEP 14: COMMIT AND PUSH
      # ==========================================

      - name: Publish Profile Updates
        working-directory: profile-repo
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git add repository-showcase.gif
          git add assets/

          if git diff --cached --quiet; then
            echo "No profile changes to publish."
          else
            git commit -m "Update Naruto GitHub Profile"
            git push
            echo "[SUCCESS] Naruto profile updated."
          fi